
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Website Title -->
    <title>
      PhotoBhai - Free Online Photo Resizer & Image Compressor
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Resize, compress and convert images online for free with PhotoBhai. Resize JPG, PNG and WebP photos, adjust dimensions and reduce image size in KB securely in your browser."
    />

    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://codingbhai.online/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/photobhai.svg"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PhotoBhai" />

    <meta
      property="og:title"
      content="PhotoBhai - Free Online Image Resizer"
    />

    <meta
      property="og:description"
      content="Resize, compress and convert images online. Fast, free and private image editing."
    />

    <meta
      property="og:url"
      content="https://your-domain.com/"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="PhotoBhai - Free Online Photo Resizer"
    />

    <meta
      name="twitter:description"
      content="Free online image resizing, compression and conversion."
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PhotoBhai",
        "url": "https://your-domain.com/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "description": "Free online image resizer, compressor and converter.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
